server:
  port: 8081
spring:
  devtools:
    restart:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5433/game_db?currentSchema=public&serverTimezone=UTC
    username: postgres
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  mail:

    host: smtp.gmail.com
    port: 587

    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
web:
  app:
    jwt-secret-key: ${JWT_SECRET_KEY}
    jwt-expiration-ms: 6000000
    jwt-refresh-expiration-ms: 6000000
    jwt-cookie-name: jwt
    id:
      node-id: 234
  frontend:
    domain: http://localhost:3000

